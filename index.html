
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC Redirect</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 300px;
        }
        h2 { margin-top: 0; }
        p { color: #94a3b8; }
    </style>
</head>
<body>

<div class="card">
    <h2 id="title">⏳ Checking status...</h2>
    <p id="message">Please wait a moment.</p>
</div>

<script>
    async function checkRedirect() {
        try {
            // Fetch config.json with a timestamp to prevent caching
            const response = await fetch('config.json?t=' + new Date().getTime());
            
            if (!response.ok) {
                throw new Error("Config not found");
            }

            const config = await response.json();

            // If active = true: Redirect immediately!
            if (config.active && config.url) {
                window.location.href = config.url;
            } else {
                // If active = false: Display disabled message
                document.getElementById('title').innerText = "🛑 Disabled";
                document.getElementById('message').innerText = "This card is currently turned off.";
            }
        } catch (error) {
            document.getElementById('title').innerText = "❌ Error";
            document.getElementById('message').innerText = "Could not load configuration.";
        }
    }

    checkRedirect();
</script>

</body>
</html>
