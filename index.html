<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC Weiterleitung</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 300px;
        }
        h2 { margin-top: 0; }
        p { color: #94a3b8; }
    </style>
</head>
<body>

<div class="card">
    <h2 id="title">⏳ Prüfe Status...</h2>
    <p id="message">Bitte einen Moment gedulden.</p>
</div>

<script>
    async function checkRedirect() {
        try {
            // Holt die config.json (mit Zeitstempel, damit kein Cache verwendet wird)
            const response = await fetch('config.json?t=' + new Date().getTime());
            
            if (!response.ok) {
                throw new Error("Config nicht gefunden");
            }

            const config = await response.json();

            // Wenn aktiv = true: Sofort weiterleiten!
            if (config.active && config.url) {
                window.location.href = config.url;
            } else {
                // Wenn aktiv = false: Deaktiviert-Meldung anzeigen
                document.getElementById('title').innerText = "🛑 Deaktiviert";
                document.getElementById('message').innerText = "Diese Karte ist aktuell ausgeschaltet.";
            }
        } catch (error) {
            document.getElementById('title').innerText = "❌ Fehler";
            document.getElementById('message').innerText = "Konnte Konfiguration nicht laden.";
        }
    }

    checkRedirect();
</script>

</body>
</html>
